name: Check scripts

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse, compare the shared engine, run PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = 'Update-SecureBootCert.ps1', 'Update-SecureBootCert-GUI.cmd'

          # 1. Both files must parse as PowerShell (the GUI's batch header is a block comment)
          foreach ($f in $files) {
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path, [ref]$tokens, [ref]$errors)
              if ($errors) {
                  $errors | ForEach-Object { Write-Host ("{0}: line {1}: {2}" -f $f, $_.Extent.StartLineNumber, $_.Message) }
                  throw "Parse errors in $f"
              }
          }

          # 2. The SB-ENGINE block must be identical in the script and the GUI
          function Get-Engine([string]$Path) {
              $t = [IO.File]::ReadAllText((Resolve-Path $Path).Path)
              $m = [regex]::Match($t, '(?s)# >>> SB-ENGINE BEGIN.*?# <<< SB-ENGINE END >>>')
              if (-not $m.Success) { throw "SB-ENGINE block not found in $Path" }
              $m.Value -replace "`r`n", "`n"
          }
          if ((Get-Engine $files[0]) -cne (Get-Engine $files[1])) { throw 'The SB-ENGINE blocks differ between the script and the GUI.' }

          # 3. Only ASCII in the scripts (Windows PowerShell 5.1 misreads UTF-8 without a BOM)
          foreach ($f in $files + 'RunMe.bat') {
              $b = [IO.File]::ReadAllBytes((Resolve-Path $f).Path)
              if ($b | Where-Object { $_ -gt 127 } | Select-Object -First 1) { throw "$f contains non-ASCII characters" }
          }

          # 4. PSScriptAnalyzer (errors only)
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Set-PSRepository PSGallery -InstallationPolicy Trusted
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $r = Invoke-ScriptAnalyzer -Path 'Update-SecureBootCert.ps1' -Severity Error
          if ($r) { $r | Format-Table -AutoSize | Out-String -Width 200 | Write-Host; throw 'PSScriptAnalyzer found errors.' }
          Write-Host 'All checks passed.'
